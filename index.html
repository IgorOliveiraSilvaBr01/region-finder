<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RegionFinder</title>
    
    <link rel="stylesheet" href="./css/imports.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <p><strong>RegionFinder</strong></p>
        <a href="#">GitHub</a>
    </header>

    <main>
        <h1>Localize qualquer região através do DDD <span>instantaneamente</span></h1>
        <p>Digite um Código de Discagem Direta a Distância (DDD) brasileiro abaixo para descobrir de onde ele é.</p>
        
        <div class="search-container">
            <input id="ddd" type="text" placeholder="Digite o DDD (ex: 11)" maxlength="2">
            <button id="btn-buscar">Localizar Região</button>
        </div>

        <!-- Onde a resposta vai aparecer -->
        <div id="resultado"></div>
    </main>

    <script src="./js/script.js"></script>
</body>
</html>
